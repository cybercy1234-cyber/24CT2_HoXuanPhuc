{% extends "base.html" %}
{% block title %}Giỏ hàng{% endblock %}
{% block content %}
<h2>🛒 Giỏ hàng</h2>
<div class="card">
  <table>
    <thead><tr><th>Món</th><th>Số lượng</th><th></th></tr></thead>
    <tbody>
      {% for item in order.items.all %}
      <tr>
        <td>{{ item.menu_item.name }}</td>
        <td>
          <form method="post" action="{% url 'update_cart' item.id %}">
            {% csrf_token %}
            <input type="number" name="quantity" value="{{ item.quantity }}">
            <button class="btn secondary" type="submit">Cập nhật</button>
          </form>
        </td>
        <td></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  <p style="margin-top:14px;"><b>Tổng tiền:</b> <span class="price">{{ order.total_price }}đ</span></p>
</div>
<div class="card">
  <form method="post" action="{% url 'submit_order' %}">
    {% csrf_token %}
    <label>Số bàn:</label>
    <input type="text" name="table_number" required>
    <button class="btn" type="submit">Gửi đơn</button>
  </form>
</div>
{% endblock %}
