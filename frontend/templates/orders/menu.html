{% extends "base.html" %}
{% block title %}Thực đơn{% endblock %}
{% block content %}
<h2>🍽️ Thực đơn</h2>
<div class="grid">
  {% for item in items %}
  <div class="card">
    {% if item.image %}<img src="{{ item.image.url }}" alt="{{ item.name }}">{% endif %}
    <h3>{{ item.name }}</h3>
    <p class="price">{{ item.price }}đ</p>
    <p>{{ item.description }}</p>
    <div class="actions" style="justify-content:center;">
      <a class="btn" href="{% url 'add_to_cart' item.id %}">Thêm vào giỏ</a>
    </div>
  </div>
  {% endfor %}
</div>
<div class="actions">
  <a class="btn secondary" href="{% url 'cart' %}">Xem giỏ hàng</a>
  <a class="btn light" href="{% url 'request_service' %}">Gọi nhân viên</a>
</div>
{% endblock %}
